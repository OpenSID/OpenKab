# Nginx configuration for securing upload directories
# Add this to your nginx server block configuration
# This prevents execution of scripts in upload directories

# Location block for uploaded files
location ~ ^/storage/uploads/ {
    # Disable PHP execution in upload directories
    location ~ \.(php|php\.|php3?|phtml|phpjpeg|pl|py|jsp|asp|htm|shtml|sh|cgi|js|exe|bat|cmd|com|pif|vbs|vbe|wsf|wsc|ws|ps1|ps2|psc|msc|msu|msp|msh|jar|pyc|pyo|pyw|rb|pm|tcl|tk|tclsh|wish)$ {
        deny all;
        return 403;
    }
    
    # Only allow specific image extensions
    location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
        # Force proper content type
        add_header Content-Type image/jpeg always;
        add_header X-Content-Type-Options nosniff always;
        
        # Disable caching if needed for development
        # add_header Cache-Control "no-store, no-cache, must-revalidate";
        
        # Prevent clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # XSS protection
        add_header X-XSS-Protection "1; mode=block" always;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 403;
    }
    
    # Default: allow only image files
    # Deny everything else
    location ~ \.(?!jpg|jpeg|png|gif|webp|svg$).*$ {
        deny all;
        return 403;
    }
}

# Additional security for artikel uploads specifically
location ~ ^/storage/uploads/artikel/ {
    # Deny all script execution
    location ~ \.(php|php3?|phtml|pl|py|jsp|asp|sh|cgi|js|exe|bat|cmd)$ {
        deny all;
        return 403;
    }
    
    # Only serve images
    location ~* \.(jpg|jpeg|png|gif|webp)$ {
        add_header Content-Type image/jpeg always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    
    # Deny everything else
    location !~* \.(jpg|jpeg|png|gif|webp)$ {
        deny all;
        return 403;
    }
}
